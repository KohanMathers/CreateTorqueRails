mod_description=Trains now need real rotational power to move. Build a Train Engine into your train and feed it rotation: its RPM sets how fast the train can go, and every carriage adds stress, so longer trains need bigger power plants.\n\nTo make that possible, the machinery on your trains keeps running while they move: steam engines and boilers, diesel engines, pumps, pipes and tanks, blaze burners, basins and more. Glue fluid source blocks onto a train to carry them along, and interact with your machines on the move: turn hand cranks, fill tanks with buckets, fuel burners, and check it all with goggles.


